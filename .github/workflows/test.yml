name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup tree-sitter-modelica
        run: npm run setup

      - name: Run tests
        run: bash test/run-tests.sh

  # Single required status check for branch protection, so it doesn't need
  # to be updated whenever the os matrix above changes.
  success:
    name: success
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more matrix jobs did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
