name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup tree-sitter-modelica
        run: npm run setup

      - name: Run tests
        run: bash test/run-tests.sh

  # Single required status check for branch protection, so it doesn't need
  # to be updated whenever the os matrix above changes.
  success:
    name: success
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release flow assumes main only ever moves forward to staging. If
      # main gains commits while staging is ahead of it, the two diverge, the
      # post-release fast-forward becomes impossible, and staging's changelog
      # silently omits whatever landed on main. Blocking merges for as long as
      # staging is ahead keeps that fast-forward guaranteed.
      - name: Require main to contain staging
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git fetch --quiet origin +refs/heads/staging:refs/remotes/origin/staging 2>/dev/null; then
            echo "No staging branch — nothing to enforce."
            exit 0
          fi

          if git merge-base --is-ancestor origin/staging origin/main; then
            echo "main contains staging — safe to merge."
            exit 0
          fi

          echo "::error::main is behind staging, so merging this PR would make them diverge."
          echo "staging is ahead by:"
          git log --oneline origin/main..origin/staging
          echo ""
          echo "Finish the release first (run Main Release, then fast-forward main):"
          echo "  git fetch origin && git checkout main && git merge --ff-only origin/staging && git push origin main"
          echo "Or, if you are abandoning that staging release, delete or reset the staging branch."
          exit 1

      - name: Check test matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more matrix jobs did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
