name: Staging Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GH_USERNAME: github-actions[bot]

jobs:
  stage:
    # Anyone with repo write access could otherwise dispatch this; pin it to
    # the maintainer explicitly instead of relying on collaborator list state.
    if: github.triggering_actor == 'AntoineGautier'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup tree-sitter-modelica
        run: npm run setup

      - name: Run test suite
        run: npm test

      - name: Configure git identity
        run: |
          git config user.name "${GH_USERNAME}"
          git config user.email "${GH_USERNAME}@users.noreply.github.com"

      - name: Create staging branch from current main
        run: git checkout -B staging HEAD

      - name: Bump version and update changelog
        run: |
          # Tag creation is deferred to the Main Release workflow, so a
          # rejected staging run never leaves a dangling git tag behind.
          npx commit-and-tag-version --skip.tag

      - name: Push staging branch
        run: |
          # actions/checkout only fetched `main`, so there's no local
          # origin/staging to compare against — force-with-lease would
          # reject the push as "stale info" without this fetch.
          git fetch origin staging || true
          git push --force-with-lease origin staging

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the package tarball
        run: |
          npm run build
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      - name: Smoke-test the packed tarball
        run: |
          mkdir -p /tmp/staging-test && cd /tmp/staging-test
          npm init -y > /dev/null
          npm install --no-save /tmp/pack/*.tgz prettier
          echo 'model Foo end Foo;' > test.mo
          npx prettier --plugin=prettier-plugin-modelica test.mo

      - name: Update staging validation marker
        run: |
          {
            echo "version: ${{ steps.version.outputs.version }}"
            echo "validated-at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .staging-validated
          git add .staging-validated
          git commit -m "chore: update staging validation marker"
          git push origin staging

      - name: Summary
        run: |
          {
            echo "## Staging Release Summary"
            echo "- **Version**: ${{ steps.version.outputs.version }}"
            echo "- Build tested against the same tarball \`npm pack\` produces for publishing."
            echo "- To amend \`staging\` (e.g. changelog wording, a quick fix): push a commit directly to \`staging\`. Do not re-run this workflow, which recreates \`staging\` from \`main\` and would discard the amendment."
            echo "- Once you're happy with \`staging\`, run **Main Release** to tag \`v${{ steps.version.outputs.version }}\`, publish to npm, and create the GitHub Release. It re-runs the test suite first, and publishes only after the tag is pushed, so a broken hand-edit fails safely without publishing or tagging anything."
            echo "- **Main Release does not update \`main\`.** Fast-forward it yourself afterwards: \`git fetch origin && git checkout main && git merge --ff-only origin/staging && git push origin main\`"
          } >> "$GITHUB_STEP_SUMMARY"
