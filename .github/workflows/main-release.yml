name: Main Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GH_USERNAME: github-actions[bot]

jobs:
  validate-staging:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          submodules: true

      - name: Validate staging marker, version and changelog entry
        id: check
        run: |
          if [ ! -f .staging-validated ]; then
            echo "::error::.staging-validated not found on staging — run Staging Release first."
            exit 1
          fi

          VERSION=$(grep '^version: ' .staging-validated | cut -d' ' -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from .staging-validated"
            exit 1
          fi
          echo "Found staging version: $VERSION"

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          HIGHEST=$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$VERSION" ] || [ "$VERSION" = "$LATEST_VERSION" ]; then
            echo "::error::Staging version ($VERSION) is not newer than the latest tag ($LATEST_TAG)."
            exit 1
          fi

          if ! grep -qE "^## \[?$VERSION\]?" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry found for $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup tree-sitter-modelica
        run: npm run setup

      - name: Run test suite
        run: npm test

      - name: Build the package tarball
        run: |
          npm run build
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      - name: Smoke-test the packed tarball
        run: |
          mkdir -p /tmp/staging-test && cd /tmp/staging-test
          npm init -y > /dev/null
          npm install --no-save /tmp/pack/*.tgz prettier
          echo 'model Foo end Foo;' > test.mo
          npx prettier --plugin=prettier-plugin-modelica test.mo

  tag-and-publish:
    needs: validate-staging
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # This job never writes to main. main's ruleset requires pull requests
      # and only the Repository admin role bypasses it, so pushing it from CI
      # would mean handing an admin-scoped PAT to a job that also runs npm
      # install scripts and build code. staging and tags are outside the
      # ruleset, so the default GITHUB_TOKEN is enough for everything here;
      # fast-forwarding main is left as a manual step.
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          submodules: true

      - name: Drop the staging validation marker
        run: |
          git config user.name "${GH_USERNAME}"
          git config user.email "${GH_USERNAME}@users.noreply.github.com"

          if [ -f .staging-validated ]; then
            git rm .staging-validated
            git commit -m "chore: remove staging validation marker"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Update npm (trusted publishing needs a recent npm version)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Setup tree-sitter-modelica
        run: npm run setup

      - name: Run test suite
        run: npm test

      - name: Tag and push staging
        run: |
          git tag "${{ needs.validate-staging.outputs.tag }}"
          git push origin staging
          git push origin "${{ needs.validate-staging.outputs.tag }}"

      - name: Publish to npm
        # Runs after the pushes on purpose: publishing is the only step here
        # that cannot be undone (a version number is burned even if you
        # unpublish), so every reversible step must succeed first. When this
        # ran before the pushes, a rejected push left 0.1.1 on npm with no tag,
        # no release, and main still on the previous version.
        #
        # Trusted publishing (OIDC, id-token: write above) authenticates this
        # step — no NPM_TOKEN secret involved. npm's trusted publisher config
        # for this package must point at this workflow file.
        run: npm publish --provenance

      - name: Extract release notes from changelog
        id: notes
        run: |
          VERSION="${{ needs.validate-staging.outputs.version }}"
          CONTENT=$(awk -v ver="$VERSION" '
            $0 ~ ("^## \\[?" ver) { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          {
            echo "content<<NOTES_EOF"
            echo "$CONTENT"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.validate-staging.outputs.tag }}" \
            --title "${{ needs.validate-staging.outputs.tag }}" \
            --notes "${{ steps.notes.outputs.content }}"

  notify-completion:
    needs: [validate-staging, tag-and-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Main Release Summary"
            echo "- **Version**: ${{ needs.validate-staging.outputs.tag }}"
            echo "- **Tag, publish & GitHub Release**: ${{ needs.tag-and-publish.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.tag-and-publish.result }}" == "success" ]; then
            {
              echo "- 📦 https://www.npmjs.com/package/prettier-plugin-modelica/v/${{ needs.validate-staging.outputs.version }}"
              echo "- 🏷️ https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate-staging.outputs.tag }}"
              echo ""
              echo "### ⚠️ Required manual step"
              echo "\`main\` was not updated by this workflow. Fast-forward it now:"
              echo '```'
              echo "git fetch origin && git checkout main && git merge --ff-only origin/staging && git push origin main"
              echo '```'
              echo "Skipping this makes the next Staging Release cut from a stale \`main\`, and the next Main Release will fail when it tries to push a tag that already exists."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
